appId: com.strok.app
productName: Strok
copyright: Copyright © 2026 Strok

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

# Compression et autonomie : l'exe embarque Node + Chromium, aucune
# installation de Node n'est requise sur la machine cible.
asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

# macOS : .dmg Apple Silicon, non signé (CSC_IDENTITY_AUTO_DISCOVERY=false dans
# les scripts npm) — electron-builder applique la signature ad-hoc requise sur
# arm64. L'.icns est généré automatiquement depuis build/icon.png (1024×1024).
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: build/icon.png
  category: public.app-category.graphics-design
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Strok
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
